services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis:/data

  rails_blue:
    image: chatwoot-fitio:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - '3001:3000'
    command: bundle exec rails s -b 0.0.0.0 -p 3000
    restart: always

  rails_green:
    image: chatwoot-fitio:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - '3002:3000'
    command: bundle exec rails s -b 0.0.0.0 -p 3000
    restart: always

  sidekiq:
    image: chatwoot-fitio:latest
    env_file: .env
    depends_on:
      - postgres
      - redis
    command: bundle exec sidekiq
    restart: always

volumes:
  postgres:
  redis:
